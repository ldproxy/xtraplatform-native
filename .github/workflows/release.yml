name: release

on:
  push:
    tags:
    - '**'
    branches-ignore:
      - '**'

jobs:
  build_libraries:
    runs-on: ${{ matrix.os.runner }}
    strategy:
      matrix:
        os:
          - runner: ubuntu-22.04
            type: linux
            platform: linux-amd64
          - runner: ubuntu-22.04-arm
            type: linux
            platform: linux-arm64
          - runner: macos-latest
            type: macos
            platform: darwin-arm64
    env:
      # linux libs are built on the target with the oldest glibc, see .github/scripts/setup-sles.sh
      BUILD_IMAGE: registry.suse.com/suse/sle15:15.5
      TARGET_IMAGES: almalinux:9 registry.suse.com/suse/sle15:15.5 ubuntu:jammy debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle
      - if: ${{ matrix.os.type == 'macos' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - if: ${{ matrix.os.type == 'macos' }}
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3

      - if: ${{ matrix.os.type == 'macos' }}
        name: java
        run: |
          ./gradlew --no-parallel --no-configuration-cache publish -Prelease=true -PdeployUser=${{ secrets.deploy_user }} -PdeployPassword=${{ secrets.deploy_password }}

      - if: ${{ matrix.os.type == 'linux' }}
        name: setup sles
        run: |
          docker run -d --name sles -v "$PWD:/workspace" -w /workspace \
            -e JAVA_HOME=/opt/java -e PATH=/opt/go/bin:/opt/java/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            "$BUILD_IMAGE" sleep infinity
          docker exec sles .github/scripts/setup-sles.sh

      - if: ${{ matrix.os.type == 'linux' }}
        name: java sles
        run: |
          docker exec sles ./gradlew --no-parallel --no-configuration-cache assemble -Prelease=true -PdeployUser=${{ secrets.deploy_user }} -PdeployPassword=${{ secrets.deploy_password }}

      - if: ${{ matrix.os.type == 'linux' }}
        name: check libs on all targets
        run: |
          for image in $TARGET_IMAGES; do
            docker run --rm -v "$PWD:/workspace:ro" -v "$JAVA_HOME:/opt/java:ro" -e LD_BIND_NOW=1 -w /workspace "$image" \
              /opt/java/bin/java .github/scripts/CheckLibs.java xtraplatform-*/build/generated/src/main/resources/*/
          done

      - if: ${{ matrix.os.type == 'linux' }}
        name: publish sles
        run: |
          docker exec sles ./gradlew --no-parallel --no-configuration-cache publish -Prelease=true -PdeployUser=${{ secrets.deploy_user }} -PdeployPassword=${{ secrets.deploy_password }}
