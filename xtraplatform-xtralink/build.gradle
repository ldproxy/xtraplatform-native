plugins {
    id "de.undercouch.download" version "4.1.2"
}

maturity = 'MATURE'
maintenance = 'FULL'
description = 'xtralink integration, jobs and store.'
//docIgnore = true

ext {
    xtralinkVersion = '0.9.7'
    buildVersion = '0'
    cyclonedxGomodVersion = 'v1.12.0'
    xtralinkBuildDir = new File(buildDir, 'xtralink')
    xtralinkLibDir = new File(xtralinkBuildDir, 'dist')
    xtralinkJavaJar = new File(xtralinkBuildDir, "ffi/java/build/libs/xtralink-${xtralinkVersion}.jar")
    xtralinkLibName = project.osdetector.os == 'osx' ? 'libxtralink.dylib' : 'libxtralink.so'
    generatedResourcesDir = new File(buildDir, 'generated/src/main/resources/')
    embeddedLibDir = new File(generatedResourcesDir, "xtralink-${xtralinkVersion}-${buildVersion}/lib")
}

dependencies {
    provided project(':xtraplatform-nativ-loader')
    provided 'de.interactive_instruments:xtraplatform-blobs'

    embedded files(xtralinkJavaJar) { builtBy 'buildXtralinkJava' }
}

project.sourceSets.main.output.dir(generatedResourcesDir)

def downloadXtralink = tasks.register('downloadXtralink', Download, {
    src "https://github.com/ldproxy/xtralink/archive/refs/tags/v${xtralinkVersion}.tar.gz"
    dest new File(new File(System.getProperty("java.io.tmpdir")), "xtralink-${xtralinkVersion}.tar.gz")
    overwrite false
})

def getXtralink = tasks.register('getXtralink', Copy, {
    dependsOn downloadXtralink
    from(tarTree(downloadXtralink.get().dest)) {
        eachFile { fcd ->
            fcd.relativePath = new RelativePath(true, fcd.relativePath.segments.drop(1))
        }
        includeEmptyDirs = false
    }
    //from(new File(projectDir, '../../../ws-xtrahub/xtralink'))
    //exclude 'data/**'

    into xtralinkBuildDir
    def copyDetails = []
    eachFile { copyDetails << it }
    doLast {
        copyDetails.each { FileCopyDetails details ->
            def target = new File(destinationDir, details.path)
            if(target.exists()) { target.setLastModified(details.lastModified) }
        }
    }
})

def printXtralink0= tasks.register('printXtralink0', Exec, {
    dependsOn(buildXtralink)
    workingDir xtralinkLibDir
    commandLine 'ls', '-lR'
})

def buildXtralink = tasks.register('buildXtralink', Exec, {
    dependsOn(getXtralink)
    inputs.dir xtralinkBuildDir
    workingDir new File(xtralinkBuildDir, 'ffi/clib/main')
    outputs.file new File(xtralinkLibDir, xtralinkLibName)
    commandLine 'make', 'shared', 'OUT=../../../dist/'
    doLast {
        def distLib = new File(xtralinkLibDir, xtralinkLibName)
        if (!distLib.exists()) {
            throw new GradleException("Go build failed, xtralink library not found at ${distLib.absolutePath}.")
        }
    }
    finalizedBy printXtralink0
})

def buildXtralinkJava= tasks.register('buildXtralinkJava', Exec, {
    dependsOn(buildXtralink)
    inputs.dir xtralinkBuildDir
    workingDir new File(xtralinkBuildDir, 'ffi/java')
    outputs.file xtralinkJavaJar
    commandLine './gradlew', 'build'
})

// reads the Go modules and the Go version from the build info of the library
def xtralinkSbom = tasks.register('xtralinkSbom', Exec, {
    def library = new File(xtralinkLibDir, xtralinkLibName)
    def output = new File(buildDir, 'sbom/xtralink.cdx.json')
    dependsOn(buildXtralink)
    inputs.file library
    outputs.file output
    workingDir buildDir
    commandLine 'go', 'run', "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${cyclonedxGomodVersion}", 'bin',
            '-json', '-licenses', '-assert-licenses', '-std', '-noserial', '-notimestamp', '-output-version', '1.6',
            '-version', "v${xtralinkVersion}", '-output', output, library
})

sbom {
    fragment xtralinkSbom
}

def printXtralink= tasks.register('printXtralink', Exec, {
    dependsOn(copyXtralinkLib)
    inputs.dir embeddedLibDir
    workingDir embeddedLibDir
    commandLine 'ls', '-lR'
})

def copyXtralinkLib = tasks.register('copyXtralinkLib', Copy, {
    dependsOn buildXtralink
    from buildXtralink
    into embeddedLibDir
    finalizedBy printXtralink
})

tasks.named('jar') {
    dependsOn copyXtralinkLib
}
tasks.named('cyclonedxDirectBom') {
    dependsOn buildXtralinkJava
}
tasks.withType(Pmd).configureEach {
    dependsOn copyXtralinkLib
}

project.subprojects { Project subproject ->
    if (subproject.name.endsWith("-tpl")) {
        subproject.afterEvaluate {
            subproject.tasks.named("compileJava") {
                dependsOn buildXtralinkJava
            }
            subproject.tasks.named("cyclonedxDirectBom") {
                dependsOn buildXtralinkJava
            }
            subproject.tasks.named("javadocJar") {
                dependsOn buildXtralinkJava
            }
            subproject.tasks.named("sourcesJar") {
                dependsOn buildXtralinkJava
            }
        }
    }
}
